name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          # Create license directory
          mkdir -p "${ANDROID_HOME}/licenses"
          # Write known license hashes
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${ANDROID_HOME}/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "${ANDROID_HOME}/licenses/android-googletv-license"
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > "${ANDROID_HOME}/licenses/android-googlexr-license"
          echo "d8453a3e15b94d68b6c81ff512c50410d7ff76e8" > "${ANDROID_HOME}/licenses/android-sdk-arm-dbt-license"
          echo "5be4da78a8d9bd7205f28d759c8ad2c75f1f7c5d" > "${ANDROID_HOME}/licenses/android-sdk-arm64-v8a-dbt-license"
          echo "c7c2713e55c2a1e2e4a2e5b2a4a8c8b2a7e9c0d1" > "${ANDROID_HOME}/licenses/android-sdk-x86_64-dbt-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${ANDROID_HOME}/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1'
          # Don't use accept-android-sdk-licenses - we handle it ourselves

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print environment info
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-not set}"
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            ls -la "$ANDROID_NDK_HOME"
          else
            echo "NDK directory not found at ANDROID_NDK_HOME"
          fi
          which cmake || echo "cmake not in PATH"
          cmake --version || echo "cmake --version failed"
          which ndk-build || echo "ndk-build not in PATH"
          ndk-build --version 2>/dev/null || echo "ndk-build --version failed"
        shell: bash

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

  build-with-native:
    name: Build with nxformat native lib
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "${ANDROID_HOME}/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${ANDROID_HOME}/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "${ANDROID_HOME}/licenses/android-googletv-license"
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > "${ANDROID_HOME}/licenses/android-googlexr-license"
          echo "d8453a3e15b94d68b6c81ff512c50410d7ff76e8" > "${ANDROID_HOME}/licenses/android-sdk-arm-dbt-license"
          echo "5be4da78a8d9bd7205f28d759c8ad2c75f1f7c5d" > "${ANDROID_HOME}/licenses/android-sdk-arm64-v8a-dbt-license"
          echo "c7c2713e55c2a1e2e4a2e5b2a4a8c8b2a7e9c0d1" > "${ANDROID_HOME}/licenses/android-sdk-x86_64-dbt-license"
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Print environment info
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-not set}"
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            ls -la "$ANDROID_NDK_HOME"
          else
            echo "NDK directory not found at ANDROID_NDK_HOME"
          fi
          which cmake || echo "cmake not in PATH"
          cmake --version || echo "cmake --version failed"
          which ndk-build || echo "ndk-build not in PATH"
          ndk-build --version 2>/dev/null || echo "ndk-build --version failed"
        shell: bash

      - name: Build nxformat for Android ARM64
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/fab918/nxformat.git /tmp/nxformat
          cd /tmp/nxformat
          mkdir build-android && cd build-android
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON \
                -DNXFORMAT_BUILD_TOOLS=OFF \
                ..
          cmake --build . --config Release -j$(nproc)
          mkdir -p ${{ github.workspace }}/app/src/main/jniLibs/arm64-v8a
          cp libnxformat.so ${{ github.workspace }}/app/src/main/jniLibs/arm64-v8a/
          ls -la ${{ github.workspace }}/app/src/main/jniLibs/arm64-v8a/
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with native lib
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload Debug APK (with native)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-with-native
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7